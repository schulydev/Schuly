name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

version-resolver:
  major:
    labels:
      - 'breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
      - 'minor'
  patch:
    labels:
      - 'bug'
      - 'bugfix'
      - 'patch'
      - 'hotfix'
      - 'security'
  default: patch

categories:
  - title: 'New'
    labels:
      - 'feature'
  - title: 'Improved'
    labels:
      - 'enhancement'
  - title: 'Fixed'
    labels:
      - 'bug'
  - title: 'Security'
    labels:
      - 'security'
  - title: 'Breaking changes'
    labels:
      - 'breaking'
      - 'breaking-change'
  - title: 'Under the hood'
    collapse-after: 5
    labels:
      - 'refactor'
  - title: 'Documentation'
    collapse-after: 5
    labels:
      - 'documentation'
  - title: 'CI / build'
    collapse-after: 5
    labels:
      - 'CI/CD'
  - title: 'Dependencies'
    collapse-after: 5
    labels:
      - 'dependencies'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&`'

# Version-bump PRs opened by the release workflow carry skip-changelog, so they never show up in notes.
exclude-labels:
  - 'skip-changelog'

no-changes-template: 'No changes in this release.'

# Before publishing, add a short "## Highlights" section above the groups by hand.
template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?\!?:.+/'
  - label: 'bug'
    title:
      - '/^fix(\(.+\))?\!?:.+/'
  - label: 'breaking'
    title:
      - '/^.+\!:.+/'
  - label: 'documentation'
    title:
      - '/^docs(\(.+\))?\!?:.+/'
    files:
      - '*.md'
      - 'docs/**/*'
  - label: 'test'
    title:
      - '/^test(\(.+\))?\!?:.+/'
    files:
      - 'test/**/*'
      - '**/*_test.dart'
