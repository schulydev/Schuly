name: Build and Release Flutter Apps

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Setup release keystore
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Setting up release keystore from secrets..."
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using existing keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > app-release.jks
          else
            echo "Generating new keystore (consider storing it as KEYSTORE_BASE64 secret)"
            keytool -genkey -v -keystore app-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release \
              -dname "CN=Schuly App, OU=Development, O=Schuly, L=Ruebliland, S=Aargau, C=CH" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -noprompt
          fi

      - name: Create key.properties
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Creating key.properties file..."
          cat > key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=release
          storeFile=../app-release.jks
          EOF

      - name: Get dependencies
        working-directory: .
        run: flutter pub get

      - name: Generate app icons
        working-directory: .
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        working-directory: .
        run: |
          flutter build apk --release --flavor prod \
            --build-name="${{ github.ref_name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL || 'https://app.schuly.dev' }}" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}"

      - name: Build Android AAB (App Bundle)
        working-directory: .
        # The AAB goes to Google Play: no in-app updater and no APK install permission.
        env:
          STORE_BUILD: "true"
        run: |
          flutter build appbundle --release --flavor prod \
            --dart-define=STORE_BUILD=true \
            --build-name="${{ github.ref_name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL || 'https://app.schuly.dev' }}" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}"

      - name: Prepare artifacts
        working-directory: .
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-prod-release.apk artifacts/schuly-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab artifacts/schuly-${{ github.ref_name }}.aab
          # The in-app updater verifies the downloaded APK against this checksum.
          (cd artifacts && sha256sum schuly-${{ github.ref_name }}.apk > schuly-${{ github.ref_name }}.apk.sha256)

      - name: Upload to Google Play
        if: github.event_name == 'release' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.schuly.app
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ./artifacts/

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: .
        run: flutter pub get

      - name: Generate app icons
        working-directory: .
        run: dart run flutter_launcher_icons

      - name: Build iOS (unsigned)
        working-directory: .
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ github.ref_name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL || 'https://app.schuly.dev' }}" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_IOS_API_KEY="${{ vars.FIREBASE_IOS_API_KEY }}" \
            --dart-define=FIREBASE_IOS_APP_ID="${{ vars.FIREBASE_IOS_APP_ID }}"

      - name: Create iOS Archive
        working-directory: .
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination generic/platform=iOS -archivePath build/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Export iOS IPA
        working-directory: .
        run: |
          cd ios
          mkdir -p artifacts
          mkdir -p build/ipa
          cp -r build/Runner.xcarchive/Products/Applications/Runner.app build/ipa/
          cd build/ipa
          zip -r ../../artifacts/schuly-${{ github.ref_name }}.ipa Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./ios/artifacts/

  # Signed App Store build, uploaded to App Store Connect (TestFlight). Runs once APPLE_TEAM_ID and the API key are set.
  appstore-ios:
    runs-on: macos-latest
    if: vars.APPLE_TEAM_ID != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: App Store Connect API key
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Configure Flutter for the store build
        run: |
          flutter build ios --release --config-only --no-codesign \
            --build-number="${{ github.run_number }}" \
            --dart-define=STORE_BUILD=true \
            --dart-define=APP_STORE_ID="${{ vars.APP_STORE_ID }}" \
            --dart-define=BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL || 'https://app.schuly.dev' }}" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_IOS_API_KEY="${{ vars.FIREBASE_IOS_API_KEY }}" \
            --dart-define=FIREBASE_IOS_APP_ID="${{ vars.FIREBASE_IOS_APP_ID }}"

      # Apple only creates development profiles for teams with a registered device, so sign
      # directly with the distribution certificate and App Store profile kept in secrets.
      - name: Install distribution signing
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE_BASE64" | base64 --decode > "$dir/schuly-appstore.mobileprovision"
          done
          # Only the Runner target reads this file; the Pods keep their own settings.
          cat >> Flutter/Release.xcconfig <<XC
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = Schuly App Store
          XC
        working-directory: ios

      - name: Archive and upload to App Store Connect
        working-directory: ios
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ vars.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination generic/platform=iOS             -archivePath build/Runner.xcarchive archive
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" -c "Add :destination string upload"             -c "Add :teamID string $TEAM_ID" -c "Add :signingStyle string manual"             -c "Add :signingCertificate string Apple Distribution"             -c "Add :provisioningProfiles dict" -c "Add :provisioningProfiles:com.schuly.app string Schuly App Store"             build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export             -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

  upload-to-release:
    needs: [build-android, build-ios]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-build/schuly-${{ github.ref_name }}.apk
            android-build/schuly-${{ github.ref_name }}.aab
            android-build/schuly-${{ github.ref_name }}.apk.sha256
            ios-build/schuly-${{ github.ref_name }}.ipa
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
